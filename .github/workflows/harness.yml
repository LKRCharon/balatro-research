name: Public harness checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protocol and formal evaluation
        run: |
          python -m unittest discover -s outputs/balatro-lab/experiments -p test_protocol.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s outputs/balatro-lab/experiments -p test_formal_eval.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Public observations and transport
        run: |
          python -m unittest discover -s outputs/balatro-lab/headless -p test_transport.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s outputs/balatro-lab/headless -p test_environment.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Telemetry accounting
        run: python -m unittest discover -s tools -p test_summarize_evaluation.py -v
      - name: Hybrid boundaries and trace accounting
        run: |
          python -m unittest discover -s outputs/balatro-lab/headless -p test_hybrid_session.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s outputs/balatro-lab/headless -p test_summarize_trace.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen candidate integrity
        run: python tools/verify_frozen.py
      - name: Combat comparison regressions
        run: |
          python -m unittest discover -s outputs/balatro-lab/experiments -p test_combat_v4.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s outputs/balatro-lab/experiments -p test_combat_audit.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s outputs/balatro-lab/headless -p test_combat_compare.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Readiness and training regressions
        run: |
          python -m pip install lupa==2.8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p test_readiness_patch.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s outputs/balatro-lab/headless -p test_train_smoke.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s outputs/balatro-lab/experiments -p test_route_v3.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
